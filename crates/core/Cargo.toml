[package]
name = "mf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mf-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
mdns-sd = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", features = ["image-data", "wayland-data-control"] }
x11rb = { version = "0.13", features = ["randr", "xfixes", "xinput", "xtest"] }
xkbcommon = "0.8"
xkeysym = "0.2"
ashpd = "0.10"
reis = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSEvent", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSImage"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
